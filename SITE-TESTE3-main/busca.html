<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        MAR DE MONSTROS • IA DOS GUERREIROS
    </title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="style-busca.css">

</head>

<body>

    <audio id="som-atena" src="audios/Atena.mp3"></audio>

    <header class="header-usuario">

        <div class="usuario-info">

            <span class="material-symbols-outlined token-icon">
                shield
            </span>

            <span id="nome-heroi" class="nome-heroi">
                Carregando...
            </span>

        </div>

    </header>

    <main class="search-container">

        <h1 class="search-title">
            IA DOS GUERREIROS
        </h1>

        <div id="resultado-loading"
            class="loading-container hidden">

            <div class="spinner"></div>

            <p id="feedback-ia">
                Consultando os deuses...
            </p>

        </div>

        <form id="form-busca" class="search-box">

            <input
                id="campo-busca"
                type="text"
                placeholder="Digite sua pergunta aos deuses..."
                required
                autocomplete="off">

            <button type="submit" class="search-btn">

                <span class="material-symbols-outlined">
                    bolt
                </span>

            </button>

        </form>

        <!-- RESULTADO IA -->

        <section
            id="resultado-pesquisa"
            class="resultado-pesquisa hidden">

            <div
                id="conteudo-texto"
                class="conteudo-texto">
            </div>

            <div class="wordwall-area">

                <a
                    href="https://wordwall.net/play/114035/117/788"
                    target="_blank"
                    class="wordwall-btn">

                    Jogar desafio no Wordwall

                </a>

            </div>

        </section>

    </main>

    <script type="module">

    import { auth } from "./firebase.js";

    import {
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {

            if(user){

                const nomeHeroi =
                    document.getElementById("nome-heroi");

                nomeHeroi.textContent =
                    user.displayName;

            } else {

                window.location.href =
                    "login-index.html";
            }

        });

    </script>

    <script src="busca.js"></script>

</body>

</html>
